const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
}[c]));

function warmLabel(o) {
  if (!o.warm) return "Miete auf Anfrage";
  let s = (o.ca ? "ca. " : "") + o.warm + " Warmmiete";
  if (o.netto) s += " · " + o.netto;
  return s;
}

const map = L.map("map", { scrollWheelZoom: true });
L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
  subdomains: "abcd",
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende &copy; <a href="https://carto.com/attributions">CARTO</a>'
}).addTo(map);

const list = document.getElementById("list");
const markers = {};
const cards = {};

function select(id, fromCard) {
  document.querySelectorAll(".card.sel").forEach(el => el.classList.remove("sel"));
  document.querySelectorAll(".pin.sel").forEach(el => el.classList.remove("sel"));
  cards[id].classList.add("sel");
  const iconEl = markers[id].getElement();
  if (iconEl) iconEl.querySelector(".pin").classList.add("sel");
  if (fromCard) {
    map.setView(markers[id].getLatLng(), 16, { animate: true });
    markers[id].openPopup();
  } else {
    cards[id].scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}

DATA.forEach((o, i) => {
  const n = i + 1;
  const approxClass = o.approx ? " approx" : "";
  const label = warmLabel(o);
  const sqm = o.sqm ? o.sqm + " m²" : "Fläche k. A.";
  const marker = L.marker([o.lat, o.lon], {
    icon: L.divIcon({
      className: "",
      html: `<div class="pin${approxClass}">${n}</div>`,
      iconSize: [28, 28],
      iconAnchor: [14, 14],
      popupAnchor: [0, -14]
    }),
    zIndexOffset: o.approx ? 0 : 100,
    title: n + ". " + o.title
  }).addTo(map);
  marker.bindPopup(
    `<strong>${n}. ${esc(o.title)}</strong><br>${esc(o.address)}${o.approx ? " <em>(ungefähre Lage)</em>" : ""}<br>${esc(sqm)} · ${esc(label)}<br><a href="${esc(o.url)}" target="_blank" rel="noopener">Zur Anzeige</a>`
  );
  marker.on("click", () => select(o.id, false));
  markers[o.id] = marker;

  const card = document.createElement("article");
  card.className = "card";
  card.id = "card-" + o.id;
  card.innerHTML = `
    <h2><span class="num${approxClass}">${n}</span><span>${esc(o.title)}</span></h2>
    <div class="meta">${esc(o.district)} · ${esc(o.address)}${o.approx ? '<span class="tag">ungefähre Lage</span>' : ""}</div>
    <div class="price">${esc(sqm)} · ${esc(label)}</div>
    <div class="sub">Verfügbarkeit: ${esc(o.avail)} · gefunden am ${esc(o.seen)} · ${esc(o.source)}</div>
    <div class="sub" style="margin-top:6px"><a href="${esc(o.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Zur Anzeige</a></div>`;
  card.addEventListener("click", () => select(o.id, true));
  cards[o.id] = card;
  list.appendChild(card);
});

map.fitBounds(L.featureGroup(Object.values(markers)).getBounds().pad(0.12));
</script>
