<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paris Lageradar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden;background:#0b0d12;color:#eee;font-family:-apple-system,system-ui,sans-serif}
header{padding:10px 14px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-size:18px;margin:0}#stand{color:#8a93a6;font-size:12px}
#wrap{position:relative;height:70vh;min-height:420px}#map{position:absolute;inset:0;background:#0b0d12}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9)}
.leaflet-heatmap-layer{opacity:.85}
#legend{position:absolute;top:10px;left:10px;z-index:500;background:rgba(15,18,26,.75);backdrop-filter:blur(6px);border-radius:10px;padding:6px 10px;font-size:11px;color:#ccc}
#legend .g{width:110px;height:8px;border-radius:4px;margin:4px 0 2px;background:linear-gradient(90deg,rgba(255,255,0,.2),#ffeb3b,#ff9800,#f44336,#8b0000)}
#legend .r{display:flex;justify-content:space-between}
#tl{position:absolute;left:0;right:0;bottom:0;z-index:600;background:linear-gradient(transparent,rgba(8,10,15,.92) 25%);padding:26px 0 calc(10px + env(safe-area-inset-bottom))}
#tlhead{display:flex;align-items:center;gap:12px;padding:0 14px 6px}
#play{flex:0 0 46px;height:46px;border-radius:50%;border:0;background:#ff6a00;color:#fff;font-size:18px;box-shadow:0 0 14px rgba(255,106,0,.6)}
#tlabel{font-size:22px;font-weight:700;flex:1}#nowbtn{border:1px solid #555;background:rgba(40,44,56,.8);color:#eee;border-radius:16px;padding:6px 12px;font-size:13px}
#track{position:relative;height:58px;margin:0 14px;touch-action:none}
#rail{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:#2a2f3c}
#fill{position:absolute;left:0;top:12px;height:6px;border-radius:3px;background:linear-gradient(90deg,#ffeb3b,#ff6a00)}
.tick{position:absolute;top:22px;width:1px;height:6px;background:#556;transform:translateX(-.5px)}
.tick.d{height:14px;background:#aab;top:20px}
.tl{position:absolute;top:30px;font-size:10px;color:#8a93a6;transform:translateX(-50%);white-space:nowrap}
.tl.d{color:#fff;font-weight:700;font-size:11px}
#nowm{position:absolute;top:2px;width:2px;height:26px;background:#4dabf7;transform:translateX(-1px)}
#nowm span{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:9px;color:#4dabf7;font-weight:700}
#thumb{position:absolute;top:3px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,106,0,.5),0 2px 8px #000}
main{padding:12px 14px 40px}h2{font-size:15px;margin:6px 0 10px;color:#ccd}
.card{background:#151924;border-radius:12px;padding:10px 12px;margin-bottom:10px;border-left:4px solid #444;overflow-wrap:anywhere}
.card.on{border-left-color:#ff6a00}.card.dim{opacity:.45}.card b{font-size:14px}
.meta{font-size:12px;color:#9aa3b5;margin-top:4px}.neu{background:#e03131;color:#fff;font-size:10px;padding:1px 5px;border-radius:4px;margin-left:4px}
.home{position:relative}.home i{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #4dabf7;box-shadow:0 0 12px 4px rgba(77,171,247,.8)}.home span{position:absolute;left:12px;top:-10px;font:700 12px system-ui;color:#fff;text-shadow:0 0 4px #000,0 0 4px #000;white-space:nowrap}
#homebtn{border:1px solid #555;background:rgba(40,44,56,.8);color:#eee;border-radius:16px;padding:6px 10px;font-size:14px}
a{color:#4dabf7}.leaflet-popup-content{font-size:13px}
</style></head><body>
<header><h1>Paris Lageradar</h1><span id="stand"></span></header>
<div id="wrap"><div id="map"></div>
<div id="legend">Aktivität<div class="g"></div><div class="r"><span>niedrig</span><span>hoch</span></div></div>
<div id="tl"><div id="tlhead"><button id="play" aria-label="Abspielen">▶</button><div id="tlabel"></div><button id="nowbtn">Jetzt</button><button id="homebtn" aria-label="Zuhause">🏠</button></div>
<div id="track"><div id="rail"></div><div id="fill"></div><div id="nowm"><span>JETZT</span></div><div id="thumb"></div></div></div></div>
<main><h2>Hotspots</h2><div id="list"></div></main>
<script>
const HOME=[48.867617,2.350194]; // 31 Rue du Caire, 75002 Paris (api-adresse.data.gouv.fr)
const km=e=>(map.distance(HOME,[e.lat,e.lon])/1000).toLocaleString('de-DE',{maximumFractionDigits:1,minimumFractionDigits:1})+' km von Zuhause';
const MIN=-24,MAX=72;let val=0;
const P=s=>new Date((s.length==16?s+':00':s)+'+01:00');
const tz={timeZone:'Europe/Paris'};
const fmt=d=>d.toLocaleString('de-DE',{...tz,weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const hm=d=>d.toLocaleTimeString('de-DE',{...tz,hour:'2-digit',minute:'2-digit'});
const map=L.map('map',{zoomControl:false}).setView([48.858,2.36],12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',maxZoom:19}).addTo(map);
const heat=L.heatLayer([],{radius:60,blur:45,maxZoom:13,max:1,minOpacity:0.05,gradient:{0.15:'rgba(255,255,0,0)',0.35:'rgba(255,235,59,.55)',0.55:'#ff9800',0.75:'#f44336',1:'#8b0000'}}).addTo(map);
map.createPane('home').style.zIndex=650;L.marker(HOME,{pane:'home',interactive:false,icon:L.divIcon({className:'home',html:'<i></i><span>Zuhause</span>',iconSize:[0,0]})}).addTo(map);
let EV=[],hits=[],base=new Date();base.setMinutes(0,0,0);const now=new Date();let timer=null;
const T=()=>new Date(base.getTime()+val*36e5);
function inten(e,t){const s=P(e.start),en=P(e.end),H=4*36e5;if(t>=s&&t<=en)return 1;const d=t<s?s-t:t-en;return d<H?1-d/H:0}
const track=document.getElementById('track'),thumb=document.getElementById('thumb'),fill=document.getElementById('fill');
const pct=v=>(v-MIN)/(MAX-MIN)*100;
function ticks(){let h='';for(let v=MIN;v<=MAX;v++){const t=new Date(base.getTime()+v*36e5);const H=+t.toLocaleString('en-GB',{...tz,hour:'2-digit',hour12:false})%24;
 if(H==0){h+=`<div class="tick d" style="left:${pct(v)}%"></div><div class="tl d" style="left:${pct(v)}%">${t.toLocaleDateString('de-DE',{...tz,weekday:'short'}).replace('.','')}</div>`}
 else if(H%6==0){h+=`<div class="tick" style="left:${pct(v)}%"></div><div class="tl" style="left:${pct(v)}%">${H}h</div>`}
 else if(H%3==0)h+=`<div class="tick" style="left:${pct(v)}%"></div>`}
 track.insertAdjacentHTML('beforeend',h);document.getElementById('nowm').style.left=pct(0)+'%'}
function render(){const t=T();document.getElementById('tlabel').textContent=fmt(t);
 thumb.style.left=pct(val)+'%';fill.style.width=pct(val)+'%';
 const pts=[];EV.forEach((e,i)=>{const a=inten(e,t);e.a=a;if(a>0)pts.push([e.lat,e.lon,a*Math.min(1,.25+e.weight/4)]);
  hits[i].setStyle({interactive:a>0});document.getElementById('c'+i).className='card'+(a==1?' on':a==0?' dim':'')});
 heat.setLatLngs(pts)}
function setFromX(x){const r=track.getBoundingClientRect();val=Math.round(MIN+Math.min(1,Math.max(0,(x-r.left)/r.width))*(MAX-MIN));render()}
track.addEventListener('pointerdown',e=>{track.setPointerCapture(e.pointerId);setFromX(e.clientX)});
track.addEventListener('pointermove',e=>{if(e.buttons||e.pressure)setFromX(e.clientX)});
L.DomEvent.disableClickPropagation(document.getElementById('tl'));L.DomEvent.disableScrollPropagation(document.getElementById('tl'));
function popup(ll){const t=T(),near=EV.filter(e=>e.a>0&&map.distance(ll,[e.lat,e.lon])<900);if(!near.length)return;
 L.popup().setLatLng(ll).setContent(near.map(e=>`<b>${e.title}</b><br><small>${e.z} · ${e.type} · ${km(e)}</small><br><a href="${e.url}" target="_blank" rel="noopener">Quelle</a>`).join('<hr>')).openOn(map)}
fetch('events.json?'+Date.now()).then(r=>r.json()).then(d=>{EV=d.events;document.getElementById('stand').textContent='Stand '+fmt(P(d.stand));
 const latest=EV.map(e=>e.first_seen).sort().pop(),list=document.getElementById('list');
 EV.forEach((e,i)=>{const st=P(e.start),en=P(e.end);e.z=fmt(st)+' – '+hm(en);
  hits.push(L.circle([e.lat,e.lon],{radius:600,opacity:0,fillOpacity:0}).on('click',ev=>popup(ev.latlng)).addTo(map));
  const c=document.createElement('div');c.id='c'+i;c.innerHTML=`<b>${e.title}</b>${e.first_seen==latest?'<span class="neu">NEU</span>':''}<div class="meta">${e.z} · ${e.place} · ${e.type} · ${km(e)}</div>`;
  c.onclick=()=>{val=Math.max(MIN,Math.min(MAX,Math.round((st-base)/36e5)));render();map.setView([e.lat,e.lon],14);window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>popup(L.latLng(e.lat,e.lon)),400)};list.appendChild(c)});
 ticks();render()});
document.getElementById('homebtn').onclick=()=>map.setView(HOME,15);
document.getElementById('nowbtn').onclick=()=>{val=0;render()};
document.getElementById('play').onclick=function(){if(timer){clearInterval(timer);timer=null;this.textContent='▶'}else{this.textContent='❚❚';timer=setInterval(()=>{val=val>=MAX?MIN:val+1;render()},350)}};
</script></body></html>
